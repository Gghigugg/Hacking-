name: Build SAYRA AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'sayra/**'
      - '.github/workflows/sayra-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build SAYRA debug APK
        working-directory: sayra
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAYRA-AI-debug
          path: sayra/app/build/outputs/apk/debug/app-debug.apk
